about: |
  我目前是[嗷嗷大学](https://example.edu)计算机学院博士生，导师是[面包教授](https://example.edu/~bread)。
  此前，我在[喵喵大学](https://example.org)获得计算机科学学士学位，GPA 3.90/4.00，专业排名 2/300。

  在科研中，我聚焦于**大语言模型的可解释性**，并且关注这些解释是否真的能帮到依赖模型的**人**。
  我喜欢“先让模型可被检查，再让它变得有用”的哲学，并且相信：一个无法被追问的模型，不值得被完全信任。
  如果你的工作和这些方向有交集，欢迎[联系我](mailto:mochi@example.edu)。

callout: 我正在寻找 **2027 年的业界研究岗位**，方向是可解释性与人机协作。

